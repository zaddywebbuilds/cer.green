name: Daily Blog Post

on:
  schedule:
    # 1 AM UTC = 9 AM Singapore time
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate article
        run: node scripts/generate-article.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Type-check
        run: npm run typecheck

      - name: Commit and push
        run: |
          git config user.name "CER Content Bot"
          git config user.email "noreply@cer.green"
          git add content/articles.ts
          if git diff --cached --quiet; then
            echo "No new article to commit."
            exit 0
          fi
          SLUG=$(git diff --cached content/articles.ts | grep "^+  slug:" | head -1 | sed "s/.*slug: '//;s/'.*//")
          git commit -m "insights: add daily article ${SLUG}"
          git push

      - name: Trigger deploy
        run: |
          gh workflow run deploy.yml --repo ${{ github.repository }} --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
